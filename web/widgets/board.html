<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TaskDAG board</title>
    <style>
      /*
       * An inline chat card, not a mini IDE: fixed chrome, one graph that
       * owns its own pan and zoom, and NO nested page scrolling. The card
       * grows to its content and the host sizes the iframe around it.
       */
      /*
       * DARK IS THE DEFAULT, AND LIGHT NEEDS PROOF.
       *
       * Inside a sandboxed iframe, `prefers-color-scheme: light` is also
       * what a browser reports when the user has expressed no preference at
       * all, and a host that never forwards its theme leaves the iframe
       * looking exactly like a light user. The two are indistinguishable,
       * so the media query cannot confirm anything — and guessing light
       * from it is what rendered a white box inside a dark conversation.
       *
       * The only trustworthy signal is the host saying so in hostContext,
       * which arrives as [data-theme]. Absent that, this card is dark.
       */
      :root {
        color-scheme: dark light;
        --bg: transparent;
        --fg: #e8ecf4;
        --muted: #98a1b1;
        --line: #2a3140;
        --chip: #1b212b;
        --accent: #6aa6ff;
        --danger: #f97066;
      }
      :root[data-theme='light'] {
        color-scheme: light;
        --fg: #16191f;
        --muted: #5e6674;
        --line: #dde1e9;
        --chip: #f1f3f8;
        --accent: #2563eb;
        --danger: #b42318;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: var(--bg); overflow: hidden; }
      body {
        color: var(--fg);
        font: 13px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        padding: 10px 12px 12px;
      }
      header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
      #title { font-weight: 600; font-size: 14px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #ready { color: var(--muted); font-size: 12px; white-space: nowrap; }

      /* The graph owns a fixed box and pans/zooms inside it. The page never scrolls. */
      /* The graph owns a fixed box and pans/zooms inside it. The page never scrolls. */
      #graph {
        display: block;
        width: 100%;
        height: 300px;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;

        /* --dag-bg MUST stay opaque: the canvas paints itself, and a
           transparent background leaves trails behind a pan. */
        --dag-bg: #11151c;
        --dag-fg: #e8ecf4;
        --dag-muted: #8b93a5;
        --dag-grid: rgba(200, 205, 216, 0.06);
        --dag-hairline: rgba(200, 205, 216, 0.22);
        --dag-edge: rgba(200, 205, 216, 0.42);
        --dag-accent: #6aa6ff;
        --dag-font: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;
        --dag-layer-gap: 40px;
      }
      :root[data-theme='light'] #graph {
        --dag-bg: #ffffff;
        --dag-fg: #16191f;
        --dag-muted: #6b7280;
        --dag-grid: rgba(20, 24, 33, 0.05);
        --dag-hairline: rgba(20, 24, 33, 0.18);
        --dag-edge: rgba(20, 24, 33, 0.32);
        --dag-accent: #2563eb;
      }

      #selected { margin-top: 10px; min-height: 20px; }
      .sel-head { font-size: 13px; }
      .key { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
      .detail { color: var(--muted); margin-top: 3px; }
      .deps { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .hint { color: var(--muted); }
      .pill {
        display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 11px;
        background: var(--chip); color: var(--muted); vertical-align: 1px;
      }
      .pill.in_progress { color: #2563eb; }
      .pill.done { color: #16a34a; }
      .pill.blocked { color: #dc2626; }

      #actions { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
      /* `display: flex` beats the [hidden] attribute's default display:none,
         which is how the buttons stayed on screen with nothing selected. */
      #actions[hidden] { display: none; }
      button {
        font: inherit; font-size: 12px; padding: 5px 12px; border-radius: 6px;
        border: 1px solid var(--line); background: var(--chip); color: var(--fg); cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.45; cursor: default; }
      /* Always-on chrome: copying and refreshing must not require having
         selected a task first, the way Start/Done do. */
      #tools { display: flex; gap: 6px; align-items: center; margin-top: 10px; }
      /* Expanding grows the graph IN FLOW. The element's own fullscreen mode
         is `position: fixed; inset: 0`, which fills the iframe viewport and
         takes the canvas out of the document -- the card's title, buttons
         and status line then sit behind a full-bleed canvas, and a host that
         sizes the frame to its content sees the body collapse. Growing a
         height keeps every part of the card where it belongs. */
      /* Expanded inside the card the host already gave us: taller, still
         bounded, still in flow. */
      :root[data-expanded] #graph { height: 520px; }
      /* Expanded because the host actually handed over a full panel: fill
         it, minus the chrome above and below. Keyed on the host's reported
         mode rather than on our own request, so leaving fullscreen by the
         host's own control puts the height back. */
      :root[data-display='fullscreen'] #graph { height: calc(100vh - 150px); }
      #refresh { margin-left: auto; }
      #copywrap { position: relative; }
      /* The menu opens UPWARDS. The body is overflow:hidden and the card is
         sized to its content, so a menu dropping below the last row would be
         clipped by the iframe instead of overlapping it. */
      #copymenu {
        position: absolute; bottom: calc(100% + 4px); left: 0; z-index: 2;
        display: flex; flex-direction: column; min-width: 148px; padding: 4px;
        background: var(--chip); border: 1px solid var(--line); border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      #copymenu[hidden] { display: none; }
      #copymenu button {
        border: 0; background: none; text-align: left; padding: 6px 10px; border-radius: 5px;
      }
      #copymenu button:hover { background: var(--line); }
      #copymenu .what { color: var(--muted); font-size: 11px; margin-left: 6px; }
      #status { color: var(--muted); font-size: 12px; min-height: 16px; margin-top: 6px; }
      #status.error { color: var(--danger); }
    </style>
  </head>
  <body>
    <header>
      <div id="title">TaskDAG</div>
      <div id="ready"></div>
    </header>

    <dag-view id="graph" orientation="LR" no-fullscreen-button no-minimap no-search empty-text="No tasks yet — ask for a plan."></dag-view>

    <div id="selected"><span class="hint">Click a task to see what it is waiting on.</span></div>

    <div id="actions" hidden>
      <button id="start" type="button">Start</button>
      <button id="done" type="button">Done</button>
    </div>

    <div id="tools">
      <div id="copywrap">
        <button id="copy" type="button" aria-haspopup="menu" aria-expanded="false">Copy &#9662;</button>
        <div id="copymenu" role="menu" hidden>
          <button type="button" role="menuitem" data-format="markdown">Markdown<span class="what">task list</span></button>
          <button type="button" role="menuitem" data-format="mermaid">Mermaid<span class="what">diagram</span></button>
          <button type="button" role="menuitem" data-format="json">JSON<span class="what">raw graph</span></button>
        </div>
      </div>
      <button id="expand" type="button" aria-pressed="false">Expand</button>
      <button id="refresh" type="button">Refresh</button>
    </div>
    <div id="status"></div>

    <script type="module" src="./board.ts"></script>
  </body>
</html>
